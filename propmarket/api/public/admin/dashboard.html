<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard — Mani Marketing</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #222535;
    --border: #2d3142; --accent: #6366f1;
    --text: #e2e8f0; --muted: #94a3b8;
    --success: #4ade80; --warn: #facc15; --danger: #f87171; --purple: #c084fc;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; padding-bottom: 4rem; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.9rem 1rem; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 1rem; font-weight: 700; }
  nav { display: flex; gap: 0.5rem; }
  nav a { color: var(--muted); text-decoration: none; font-size: 0.8rem; padding: 0.3rem 0.6rem; border-radius: 5px; }
  nav a:hover, nav a.active { background: var(--surface2); color: var(--text); }
  .container { padding: 1rem; max-width: 960px; margin: 0 auto; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.65rem; margin-bottom: 1.25rem; }
  @media (min-width: 600px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1rem; }
  .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 0.3rem; }
  .stat-value { font-size: 1.8rem; font-weight: 700; line-height: 1; }
  .stat-value.warn   { color: var(--warn); }
  .stat-value.lead   { color: var(--success); }
  .stat-value.guest  { color: var(--purple); }
  .stat-value.camp   { color: #60a5fa; }
  .section-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 1.25rem 0 0.6rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
  select, input[type=date] { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.4rem 0.6rem; font-size: 0.82rem; }
  .line-toggle { display: flex; gap: 0.4rem; }
  .line-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 0.35rem 0.75rem; font-size: 0.78rem; cursor: pointer; }
  .line-btn.active { border-color: var(--accent); color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { background: var(--surface2); padding: 0.5rem 0.75rem; text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  td { padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .bar-wrap { background: var(--bg); border-radius: 4px; height: 8px; width: 100%; overflow: hidden; }
  .bar { height: 100%; border-radius: 4px; }
  .card-table { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .empty { color: var(--muted); text-align: center; padding: 2rem; font-size: 0.85rem; }
  .line-badge { display: inline-block; padding: .15rem .45rem; border-radius: 4px; font-size: .7rem; font-weight: 600; }
  .beach  { background: #1e3a5f; color: #60a5fa; }
  .student{ background: #14532d; color: var(--success); }
  .number { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="header">
  <h1>Mani Marketing</h1>
  <nav>
    <a href="/admin/dashboard" class="active">Dashboard</a>
    <a href="/admin/queue">Queue</a>
  </nav>
</div>

<div class="container">

  <!-- KPI summary row -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-label">Pending approvals</div><div class="stat-value warn" id="s-pending">…</div></div>
    <div class="stat-card"><div class="stat-label">New leads</div><div class="stat-value lead" id="s-leads">…</div></div>
    <div class="stat-card"><div class="stat-label">Guest list</div><div class="stat-value guest" id="s-guests">…</div></div>
    <div class="stat-card"><div class="stat-label">Active campaigns</div><div class="stat-value camp" id="s-campaigns">…</div></div>
  </div>

  <!-- Line-level funnel -->
  <div class="section-title">Funnel by property line</div>
  <div class="card-table" id="line-funnel-table"><div class="empty">Loading…</div></div>

  <!-- Per-property funnel -->
  <div class="section-title" style="margin-top:1.5rem">
    Per-property funnel
    <span style="margin-left:.75rem">
      <select id="line-filter" onchange="loadPropertyFunnel()">
        <option value="">All lines</option>
        <option value="beach-houses">Beach Houses</option>
        <option value="student-condos">Student Condos</option>
      </select>
    </span>
    <span style="margin-left:.5rem">
      From <input type="date" id="from-date" onchange="loadPropertyFunnel()">
      To <input type="date" id="to-date" onchange="loadPropertyFunnel()">
    </span>
  </div>
  <div class="card-table" id="property-funnel-table"><div class="empty">Loading…</div></div>

</div>

<script>
const STAGES = ['reach','engagement','lead','inquiry','direct_booking'];
const STAGE_LABELS = { reach:'Reach', engagement:'Engagement', lead:'Leads', inquiry:'Inquiries', direct_booking:'Direct bookings' };
const STAGE_COLORS = { reach:'#6366f1', engagement:'#60a5fa', lead:'#4ade80', inquiry:'#facc15', direct_booking:'#f97316' };

async function loadSummary() {
  const d = await fetch('/api/analytics/summary').then(r => r.json());
  document.getElementById('s-pending').textContent  = d.pending_actions;
  document.getElementById('s-leads').textContent    = d.new_leads;
  document.getElementById('s-guests').textContent   = d.active_guests;
  document.getElementById('s-campaigns').textContent= d.active_campaigns;
}

async function loadLineFunnel() {
  const d = await fetch('/api/analytics/line-summary').then(r => r.json());
  const el = document.getElementById('line-funnel-table');
  if (!d.length) { el.innerHTML = '<div class="empty">No analytics data yet. Events are recorded automatically as leads, posts, and bookings come in.</div>'; return; }

  el.innerHTML = `<table>
    <tr><th>Line</th>${STAGES.map(s => `<th class="number">${STAGE_LABELS[s]}</th>`).join('')}</tr>
    ${d.map(row => `
      <tr>
        <td><span class="line-badge ${row.line_slug === 'beach-houses' ? 'beach' : 'student'}">${row.line_name}</span></td>
        ${STAGES.map(s => `<td class="number">${fmt(row.funnel[s])}</td>`).join('')}
      </tr>`).join('')}
  </table>`;
}

async function loadPropertyFunnel() {
  const line = document.getElementById('line-filter').value;
  const from = document.getElementById('from-date').value;
  const to   = document.getElementById('to-date').value;
  const params = new URLSearchParams();
  if (line) params.set('line', line);
  if (from) params.set('from', from);
  if (to)   params.set('to', to);

  const d = await fetch('/api/analytics/funnel?' + params).then(r => r.json());
  const el = document.getElementById('property-funnel-table');
  if (!d.length) { el.innerHTML = '<div class="empty">No data for selected filters.</div>'; return; }

  // Find max value per stage for bar scaling
  const maxes = {};
  for (const s of STAGES) maxes[s] = Math.max(1, ...d.map(r => r.funnel[s] || 0));

  el.innerHTML = `<table>
    <tr><th>Property</th><th>Line</th>${STAGES.map(s => `<th class="number">${STAGE_LABELS[s]}</th>`).join('')}</tr>
    ${d.map(row => `
      <tr>
        <td>${row.property_name}</td>
        <td><span class="line-badge ${row.line_slug === 'beach-houses' ? 'beach' : 'student'}">${row.line_slug === 'beach-houses' ? 'Beach' : 'Student'}</span></td>
        ${STAGES.map(s => {
          const v = row.funnel[s] || 0;
          const pct = Math.round((v / maxes[s]) * 100);
          return `<td class="number">
            ${fmt(v)}
            <div class="bar-wrap" style="margin-top:.25rem"><div class="bar" style="width:${pct}%;background:${STAGE_COLORS[s]}"></div></div>
          </td>`;
        }).join('')}
      </tr>`).join('')}
  </table>`;
}

function fmt(n) { return n == null ? '—' : Number(n).toLocaleString(); }

loadSummary();
loadLineFunnel();
loadPropertyFunnel();
setInterval(loadSummary, 60000);
</script>
</body>
</html>
